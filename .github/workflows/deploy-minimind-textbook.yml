name: Deploy MiniMind textbook

on:
  push:
    branches: [main]
    paths:
      - "ai-agent-book/chap-2/exp-2-2/minimind-textbook/**"
      - ".github/workflows/deploy-minimind-textbook.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -a ai-agent-book/chap-2/exp-2-2/minimind-textbook/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
